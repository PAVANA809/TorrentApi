<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent Search</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
            font-size: 2.5rem;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            background: #0f3460;
            color: #fff;
            outline: none;
        }
        input[type="text"]::placeholder { color: #888; }
        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background: #00d4ff;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #00a8cc; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error {
            background: #e94560;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .torrent {
            background: #0f3460;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        .torrent:hover { transform: translateX(5px); }
        .torrent-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #fff;
        }
        .torrent-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .torrent-meta span { display: flex; align-items: center; gap: 4px; }
        .seed { color: #4ecca3; }
        .peer { color: #e94560; }
        .magnet-box {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .magnet-input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #1a1a2e;
            color: #00d4ff;
            font-size: 0.85rem;
            word-break: break-all;
            outline: none;
        }
        .copy-btn {
            padding: 10px 18px;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .copied {
            background: #4ecca3 !important;
            color: #1a1a2e !important;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #00d4ff;
            padding: 40px;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #888;
            font-size: 1.1rem;
        }
        .poster {
            width: 60px;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 14px;
            float: left;
        }
        .torrent-header { overflow: hidden; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧲 Torrent Search</h1>
        <div class="search-box">
            <input type="text" id="query" placeholder="Search for movies, shows, software..." onkeydown="if(event.key==='Enter')search()">
            <button id="searchBtn" onclick="search()">Search</button>
        </div>
        <div id="results"></div>
    </div>

    <script>
        async function search() {
            const query = document.getElementById('query').value.trim();
            const btn = document.getElementById('searchBtn');
            const results = document.getElementById('results');

            if (!query) return;

            btn.disabled = true;
            btn.textContent = 'Searching...';
            results.innerHTML = '<div class="loading">Searching torrents...</div>';

            try {
                const res = await fetch('/search/' + encodeURIComponent(query));
                const data = await res.json();

                if (!res.ok || !data.data || data.data.length === 0) {
                    results.innerHTML = '<div class="no-results">No torrents found. Try a different query.</div>';
                    return;
                }

                renderResults(data.data);
            } catch (err) {
                results.innerHTML = '<div class="error">Error fetching results. Please try again.</div>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Search';
            }
        }

        function renderResults(torrents) {
            const results = document.getElementById('results');
            results.innerHTML = torrents.map((t, i) => `
                <div class="torrent">
                    ${t.imgurl ? `<img src="${escapeHtml(t.imgurl)}" class="poster" alt="poster">` : ''}
                    <div class="torrent-header">
                        <div class="torrent-title">${escapeHtml(t.title)}</div>
                        <div class="torrent-meta">
                            <span class="seed">🌱 ${t.seeds || 0} seeds</span>
                            <span class="peer">🔻 ${t.peers || 0} peers</span>
                            <span>📦 ${t.size || 'N/A'}</span>
                            <span>🏷️ ${escapeHtml(t.provider || 'Unknown')}</span>
                        </div>
                    </div>
                    <div class="magnet-box">
                        <input type="text" class="magnet-input" id="magnet-${i}" value="${escapeHtml(t.magnet || '')}" readonly>
                        <button class="copy-btn" id="btn-${i}" onclick="copyMagnet(${i})">Copy Magnet</button>
                    </div>
                </div>
            `).join('');
        }

        async function copyMagnet(index) {
            const input = document.getElementById('magnet-' + index);
            const btn = document.getElementById('btn-' + index);
            if (!input.value) return;

            try {
                await navigator.clipboard.writeText(input.value);
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Magnet';
                    btn.classList.remove('copied');
                }, 1500);
            } catch {
                input.select();
                document.execCommand('copy');
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Magnet';
                    btn.classList.remove('copied');
                }, 1500);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
